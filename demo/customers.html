<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>কাস্টমার</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShell"></div>

<div class="main-content" id="mainContent">
<div class="container-fluid py-4">

  <div class="d-flex align-items-center justify-content-between mb-4">
    <h4 class="mb-0"><i class="bi bi-people me-2"></i>কাস্টমার ব্যবস্থাপনা</h4>
    <button class="btn btn-primary" onclick="openAddModal()">
      <i class="bi bi-person-plus me-1"></i>নতুন কাস্টমার
    </button>
  </div>

  <div class="mb-3">
    <input type="text" id="searchInput" class="form-control"
           placeholder="নাম বা ফোন দিয়ে খুঁজুন...">
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0" id="customersTable">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>নাম</th>
            <th>ফোন</th>
            <th>ঠিকানা</th>
            <th class="text-end">মোট ক্রয়</th>
            <th class="text-end">বাকি</th>
            <th class="text-center">একশন</th>
          </tr>
        </thead>
        <tbody id="customersBody">
          <tr>
            <td colspan="7" class="text-center py-5 text-muted">
              <div class="spinner-border spinner-border-sm me-2"></div>লোড হচ্ছে...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</div>

<!-- Add / Edit Modal -->
<div class="modal fade" id="customerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="modalTitle">নতুন কাস্টমার</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="customerForm" onsubmit="submitCustomer(event)">
        <div class="modal-body">
          <input type="hidden" id="customerId" name="id" value="">
          <div class="mb-3">
            <label class="form-label fw-semibold">
              নাম <span class="text-danger">*</span>
            </label>
            <input type="text" class="form-control" id="customerName"
                   name="name" required maxlength="150" autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">ফোন নম্বর</label>
            <input type="text" class="form-control" id="customerPhone"
                   name="phone" maxlength="20">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">ঠিকানা</label>
            <textarea class="form-control" id="customerAddress"
                      name="address" rows="2" maxlength="500"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">বাতিল</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">সংরক্ষণ করুন</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/demo/seed.js"></script>
<script src="assets/js/demo/db.js"></script>
<script src="assets/js/demo/auth.js"></script>
<script src="assets/js/demo/compute.js"></script>
<script src="assets/js/demo/apiRouter.js"></script>
<script src="assets/js/demo/api/dashboard.js"></script>
<script src="assets/js/demo/api/customers.js"></script>
<script src="assets/js/demo/api/products.js"></script>
<script src="assets/js/demo/api/stock.js"></script>
<script src="assets/js/demo/api/suppliers.js"></script>
<script src="assets/js/demo/api/users.js"></script>
<script src="assets/js/demo/mockApi.js"></script>
<script src="assets/js/demo/layout.js"></script>

<script>
const BASE_URL = '.';
const IS_ADMIN = Layout.boot() && DemoAuth.isAdmin();
</script>

<script src="assets/js/app.js"></script>
<!-- unchanged copy of the original assets/js/customers.js -->
<script src="assets/js/customers.js"></script>
</body>
</html>
