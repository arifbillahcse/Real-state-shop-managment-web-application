<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — রড সিমেন্ট ম্যানেজমেন্ট</title>
    <meta name="description" content="Rod &amp; Cement Shop Management System — front-end demo. No server, no database.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 1rem;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }
        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #e63946, #457b9d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            color: #fff;
        }
        .btn-login {
            background: linear-gradient(135deg, #e63946, #c1121f);
            border: none;
            color: #fff;
            font-weight: 600;
            letter-spacing: .5px;
        }
        .btn-login:hover { opacity: .9; color: #fff; }
        .form-control:focus { border-color: #e63946; box-shadow: 0 0 0 .2rem rgba(230,57,70,.2); }
        .demo-hint {
            background: #fff8e1;
            border: 1px dashed #ffb300;
            border-radius: 10px;
            padding: .75rem 1rem;
            font-size: .85rem;
        }
        .demo-hint code {
            background: #fff;
            padding: .1rem .4rem;
            border-radius: 4px;
            color: #c1121f;
        }
        .cred-btn {
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            font: inherit;
            color: inherit;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-icon"><i class="bi bi-shop"></i></div>
    <h4 class="text-center fw-bold mb-1">রড সিমেন্ট ম্যানেজমেন্ট</h4>
    <p class="text-center text-muted small mb-3">আপনার অ্যাকাউন্টে লগইন করুন</p>

    <div class="demo-hint mb-3">
        <div class="fw-semibold mb-2">
            <i class="bi bi-info-circle-fill text-warning me-1"></i>ডেমো অ্যাকাউন্ট
        </div>
        <button class="cred-btn d-block mb-1" data-user="admin" data-pass="admin123">
            <i class="bi bi-shield-check text-danger me-1"></i>
            Admin — <code>admin</code> / <code>admin123</code>
        </button>
        <button class="cred-btn d-block" data-user="staff" data-pass="staff123">
            <i class="bi bi-person text-secondary me-1"></i>
            Staff — <code>staff</code> / <code>staff123</code>
        </button>
        <div class="text-muted mt-2" style="font-size:.78rem">
            ক্লিক করলে স্বয়ংক্রিয়ভাবে পূরণ হবে।
        </div>
    </div>

    <div id="loginError" class="alert alert-danger py-2 d-none">
        <i class="bi bi-exclamation-triangle-fill me-1"></i><span></span>
    </div>

    <form id="loginForm" novalidate>
        <div class="mb-3">
            <label class="form-label fw-semibold">ইউজারনেম</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="username" class="form-control"
                       placeholder="username" required autofocus autocomplete="username">
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">পাসওয়ার্ড</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" class="form-control"
                       placeholder="••••••••" required autocomplete="current-password">
            </div>
        </div>
        <button type="submit" class="btn btn-login w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> লগইন করুন
        </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0" style="font-size:.78rem">
        এটি একটি ফ্রন্ট-এন্ড প্রোটোটাইপ। সব ডেটা আপনার ব্রাউজারে থাকে —
        কোনো সার্ভার বা ডেটাবেস নেই।
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/demo/seed.js"></script>
<script src="assets/js/demo/db.js"></script>
<script src="assets/js/demo/auth.js"></script>
<script>
DemoDB.init();

if (DemoAuth.isLoggedIn()) {
    window.location.replace('dashboard.html');
}

document.querySelectorAll('.cred-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.getElementById('username').value = btn.dataset.user;
        document.getElementById('password').value = btn.dataset.pass;
    });
});

document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();

    const box  = document.getElementById('loginError');
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;

    if (!user.trim() || !pass) {
        return showError('ইউজারনেম ও পাসওয়ার্ড দিন।');
    }

    const res = DemoAuth.login(user, pass);
    if (res.success) {
        window.location.href = 'dashboard.html';
    } else {
        showError(res.message);
    }

    function showError(msg) {
        box.querySelector('span').textContent = msg;
        box.classList.remove('d-none');
    }
});
</script>
</body>
</html>
