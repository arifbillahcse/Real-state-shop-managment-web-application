<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ড্যাশবোর্ড</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShell"></div>

<div class="main-content" id="mainContent">

    <div class="page-header">
        <h5><i class="bi bi-speedometer2 me-2 text-danger"></i>ড্যাশবোর্ড</h5>
        <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i><span id="todayLabel"></span></span>
    </div>

    <div id="lowStockAlert"></div>

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <p class="text-muted small mb-1">আজকের বিক্রয়</p>
                        <h5 class="fw-bold mb-0" id="statTodayTotal">—</h5>
                        <small class="text-muted"><span id="statTodayCount">0</span>টি লেনদেন</small>
                    </div>
                    <div class="stat-icon bg-danger bg-opacity-10 text-danger">
                        <i class="bi bi-cart-check"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <p class="text-muted small mb-1">আজকের নগদ</p>
                        <h5 class="fw-bold mb-0" id="statTodayPaid">—</h5>
                        <small class="text-muted">প্রদত্ত</small>
                    </div>
                    <div class="stat-icon bg-success bg-opacity-10 text-success">
                        <i class="bi bi-cash-stack"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <p class="text-muted small mb-1">মোট বাকি</p>
                        <h5 class="fw-bold text-danger mb-0" id="statTotalDue">—</h5>
                        <small class="text-muted">সকল কাস্টমার</small>
                    </div>
                    <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                        <i class="bi bi-wallet2"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <p class="text-muted small mb-1">স্টক মূল্য</p>
                        <h5 class="fw-bold mb-0" id="statStockValue">—</h5>
                        <small class="text-muted">বর্তমান স্টক</small>
                    </div>
                    <div class="stat-icon bg-info bg-opacity-10 text-info">
                        <i class="bi bi-boxes"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart + Low Stock -->
    <div class="row g-3">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold">
                    <i class="bi bi-bar-chart me-1 text-danger"></i> গত ৭ দিনের বিক্রয়
                </div>
                <div class="card-body">
                    <canvas id="salesChart" height="120"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-semibold">
                    <i class="bi bi-exclamation-triangle me-1 text-warning"></i> কম স্টকের পণ্য
                </div>
                <div class="card-body p-0" id="lowStockPanel">
                    <p class="text-center text-muted py-4 small">
                        <span class="spinner-border spinner-border-sm me-2"></span>লোড হচ্ছে...
                    </p>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<script src="assets/js/demo/seed.js"></script>
<script src="assets/js/demo/db.js"></script>
<script src="assets/js/demo/auth.js"></script>
<script src="assets/js/demo/compute.js"></script>
<script src="assets/js/demo/apiRouter.js"></script>
<script src="assets/js/demo/api/dashboard.js"></script>
<script src="assets/js/demo/api/customers.js"></script>
<script src="assets/js/demo/api/products.js"></script>
<script src="assets/js/demo/api/stock.js"></script>
<script src="assets/js/demo/api/suppliers.js"></script>
<script src="assets/js/demo/api/users.js"></script>
<script src="assets/js/demo/mockApi.js"></script>
<script src="assets/js/demo/layout.js"></script>

<script>
const BASE_URL = '.';
const IS_ADMIN = Layout.boot() && DemoAuth.isAdmin();
</script>

<script src="assets/js/app.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
