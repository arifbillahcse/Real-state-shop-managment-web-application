<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-bs-theme','dark');}catch(e){}})();</script>
    <title>ড্যাশবোর্ড</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body>

<div id="appShell"></div>

<div class="main-content" id="mainContent">

    <div class="page-header">
        <h5><i class="bi bi-speedometer2 me-2 text-danger"></i>ড্যাশবোর্ড</h5>
        <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i><span id="todayLabel"></span></span>
    </div>

    <!-- Stat cards (built to match the signed-in role) -->
    <div class="row g-3 mb-4" id="statCards"></div>

    <!-- Sales chart + low stock -->
    <div class="row g-3 mb-4">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold">
                    <i class="bi bi-bar-chart me-1 text-danger"></i> গত ৭ দিনের বিক্রয়
                </div>
                <div class="card-body">
                    <canvas id="salesChart" height="120"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-semibold">
                    <i class="bi bi-exclamation-triangle me-1 text-warning"></i> কম স্টকের পণ্য
                </div>
                <div class="card-body p-0" id="lowStockPanel">
                    <p class="text-center text-muted py-4 small">
                        <span class="spinner-border spinner-border-sm me-2"></span>লোড হচ্ছে...
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent sales -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-semibold"><i class="bi bi-clock-history me-1 text-danger"></i> সাম্প্রতিক বিক্রয়</span>
            <a href="sales.html" class="btn btn-sm btn-outline-secondary demo-soon">
                সব দেখুন <i class="bi bi-arrow-right ms-1"></i>
            </a>
        </div>
        <div class="table-responsive" id="recentSalesPanel">
            <p class="text-center text-muted py-4 small">
                <span class="spinner-border spinner-border-sm me-2"></span>লোড হচ্ছে...
            </p>
        </div>
    </div>

</div>

<script src="assets/js/demo/seed.js"></script>
<script src="assets/js/demo/db.js"></script>
<script src="assets/js/demo/auth.js"></script>
<script src="assets/js/demo/compute.js"></script>
<script src="assets/js/demo/apiRouter.js"></script>
<script src="assets/js/demo/api/dashboard.js"></script>
<script src="assets/js/demo/mockApi.js"></script>
<script src="assets/js/demo/layout.js"></script>

<script>
const BASE_URL = '.';
const IS_ADMIN = Layout.boot() && DemoAuth.isAdmin();
</script>

<script src="assets/js/app.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
