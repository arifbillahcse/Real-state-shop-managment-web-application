<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>বাকি / পেমেন্ট</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShell"></div>

<div class="main-content" id="mainContent">
<div class="container-fluid py-4">

  <h4 class="mb-4"><i class="bi bi-cash-stack me-2"></i>বাকি / পেমেন্ট</h4>

  <!-- Due summary cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card stat-card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-danger text-white">
            <i class="bi bi-exclamation-circle fs-4"></i>
          </div>
          <div>
            <div class="stat-value text-danger" id="cardTotalDue">—</div>
            <div class="stat-label">মোট বাকি</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stat-card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-warning text-dark">
            <i class="bi bi-people fs-4"></i>
          </div>
          <div>
            <div class="stat-value" id="cardDueCount">—</div>
            <div class="stat-label">বাকিদার গ্রাহক</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stat-card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-success text-white">
            <i class="bi bi-cart-check fs-4"></i>
          </div>
          <div>
            <div class="stat-value" id="cardTotalPurchase">—</div>
            <div class="stat-label">মোট বিক্রয়</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ul class="nav nav-pills mb-4" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#payTab" type="button">
        <i class="bi bi-cash-coin me-1"></i>পেমেন্ট নিন
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="pill" data-bs-target="#dueListTab" type="button"
              id="dueListTabBtn">
        <i class="bi bi-people me-1"></i>বাকি তালিকা
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="pill" data-bs-target="#historyTab" type="button"
              id="historyTabBtn">
        <i class="bi bi-clock-history me-1"></i>পেমেন্ট ইতিহাস
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="pill" data-bs-target="#ledgerTab" type="button"
              id="ledgerTabBtn">
        <i class="bi bi-journal-text me-1"></i>খাতা
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ===== PAY TAB ===== -->
    <div class="tab-pane fade show active" id="payTab">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <i class="bi bi-cash-coin me-1"></i>নতুন পেমেন্ট রেকর্ড
            </div>
            <div class="card-body">
              <form id="paymentForm" onsubmit="submitPayment(event)">

                <!-- Customer select -->
                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    কাস্টমার <span class="text-danger">*</span>
                  </label>
                  <select class="form-select" id="payCustomerId" name="customer_id"
                          onchange="onCustomerChange(this)" required>
                    <option value="">-- কাস্টমার নির্বাচন করুন --</option>
                  </select>
                </div>

                <!-- Outstanding sales for selected customer -->
                <div id="outstandingSection" class="d-none mb-3">
                  <label class="form-label fw-semibold text-muted small">বাকি বিক্রয় (ক্লিক করলে স্বয়ংক্রিয় পরিমাণ বসবে)</label>
                  <div id="outstandingSalesList" class="border rounded p-2 bg-light">
                    <div class="text-center text-muted small py-2">লোড হচ্ছে...</div>
                  </div>
                </div>
                <input type="hidden" id="selectedSaleId" name="sale_id" value="">

                <!-- Amount -->
                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    পরিমাণ (৳) <span class="text-danger">*</span>
                  </label>
                  <input type="number" class="form-control form-control-lg"
                         id="payAmount" name="amount"
                         min="0.01" step="0.01" placeholder="০.০০" required>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">পেমেন্ট পদ্ধতি</label>
                    <select class="form-select" id="payMethod" name="payment_method">
                      <option value="cash">নগদ</option>
                      <option value="mobile_banking">মোবাইল ব্যাংকিং</option>
                      <option value="cheque">চেক</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">তারিখ</label>
                    <input type="date" class="form-control" id="payDate" name="payment_date">
                  </div>
                </div>

                <div id="refNoSection" class="mb-3 d-none">
                  <label class="form-label fw-semibold">রেফারেন্স নং (চেক/মোবাইল)</label>
                  <input type="text" class="form-control" id="payRefNo"
                         name="reference_no" maxlength="100">
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold text-muted">নোট</label>
                  <textarea class="form-control" id="payNote" name="note"
                            rows="2" maxlength="500"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="submitPayBtn">
                  <i class="bi bi-check-circle me-2"></i>পেমেন্ট সংরক্ষণ করুন
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div><!-- /payTab -->

    <!-- ===== DUE LIST TAB ===== -->
    <div class="tab-pane fade" id="dueListTab">
      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>কাস্টমার</th>
                <th>ফোন</th>
                <th class="text-end">মোট ক্রয়</th>
                <th class="text-end">পরিশোধ</th>
                <th class="text-end">বাকি</th>
                <th class="text-center">একশন</th>
              </tr>
            </thead>
            <tbody id="dueListBody"></tbody>
            <tfoot id="dueListFoot"></tfoot>
          </table>
        </div>
      </div>
    </div><!-- /dueListTab -->

    <!-- ===== HISTORY TAB ===== -->
    <div class="tab-pane fade" id="historyTab">
      <div class="card shadow-sm mb-3">
        <div class="card-body py-2">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small text-muted mb-1">তারিখ থেকে</label>
              <input type="date" class="form-control form-control-sm" id="hDateFrom">
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted mb-1">তারিখ পর্যন্ত</label>
              <input type="date" class="form-control form-control-sm" id="hDateTo">
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted mb-1">কাস্টমার</label>
              <select class="form-select form-select-sm" id="hCustomer">
                <option value="">সকল কাস্টমার</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary btn-sm w-100" onclick="loadHistory()">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-dark">
              <tr>
                <th>তারিখ</th>
                <th>কাস্টমার</th>
                <th>ইনভয়েস</th>
                <th>পদ্ধতি</th>
                <th>রেফ</th>
                <th class="text-end">পরিমাণ</th>
                <th>নোট</th>
              </tr>
            </thead>
            <tbody id="historyBody">
              <tr>
                <td colspan="7" class="text-center py-5 text-muted">
                  ইতিহাস ট্যাবে ক্লিক করলে লোড হবে
                </td>
              </tr>
            </tbody>
            <tfoot id="historyFooter"></tfoot>
          </table>
        </div>
      </div>
    </div><!-- /historyTab -->

    <!-- ===== LEDGER TAB ===== -->
    <div class="tab-pane fade" id="ledgerTab">
      <div class="card shadow-sm mb-3">
        <div class="card-body py-2">
          <div class="row g-2 align-items-end">
            <div class="col-md-5">
              <label class="form-label small text-muted mb-1">কাস্টমার নির্বাচন করুন</label>
              <select class="form-select" id="ledgerCustomer">
                <option value="">-- কাস্টমার নির্বাচন করুন --</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100" onclick="loadLedger()">
                <i class="bi bi-journal-text me-1"></i>দেখুন
              </button>
            </div>
          </div>
        </div>
      </div>
      <div id="ledgerContent">
        <div class="text-center py-5 text-muted">
          কাস্টমার নির্বাচন করুন
        </div>
      </div>
    </div><!-- /ledgerTab -->

  </div><!-- /tab-content -->
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/demo/seed.js"></script>
<script src="assets/js/demo/db.js"></script>
<script src="assets/js/demo/auth.js"></script>
<script src="assets/js/demo/compute.js"></script>
<script src="assets/js/demo/apiRouter.js"></script>
<script src="assets/js/demo/api/dashboard.js"></script>
<script src="assets/js/demo/api/customers.js"></script>
<script src="assets/js/demo/api/payments.js"></script>
<script src="assets/js/demo/api/products.js"></script>
<script src="assets/js/demo/api/sales.js"></script>
<script src="assets/js/demo/api/stock.js"></script>
<script src="assets/js/demo/api/suppliers.js"></script>
<script src="assets/js/demo/api/users.js"></script>
<script src="assets/js/demo/mockApi.js"></script>
<script src="assets/js/demo/layout.js"></script>

<script>
const BASE_URL = '.';
const IS_ADMIN = Layout.boot() && DemoAuth.isAdmin();

// pages/payments.php rendered the summary cards, the due list and the three
// customer dropdowns in PHP. The demo renders them here so that
// assets/js/payments.js runs unmodified — and re-renders them whenever a tab
// is shown, so a recorded payment is reflected without reloading the page.
const DueViews = (() => {
    const esc = Layout.esc;
    const money = n => parseFloat(n || 0).toLocaleString('en-IN', {
        minimumFractionDigits: 2, maximumFractionDigits: 2
    }) + ' ৳';

    function customersWithDues() {
        const dues = Compute.customerDues();
        return DemoDB.table('customers')
            .filter(c => Number(c.is_active) === 1)
            .map(c => {
                const d = dues.find(x => Number(x.customer_id) === Number(c.id));
                return Object.assign({}, c, {
                    total_due:      d ? d.total_due      : 0,
                    total_purchase: d ? d.total_purchase : 0,
                });
            })
            .sort((a, b) => a.name.localeCompare(b.name));
    }

    function renderCards(all) {
        const totalDue      = all.reduce((a, c) => a + c.total_due, 0);
        const totalPurchase = all.reduce((a, c) => a + c.total_purchase, 0);
        const dueCount      = all.filter(c => c.total_due > 0).length;

        document.getElementById('cardTotalDue').textContent      = money(totalDue);
        document.getElementById('cardDueCount').textContent      = dueCount + ' জন';
        document.getElementById('cardTotalPurchase').textContent = money(totalPurchase);
    }

    function renderSelects(all) {
        const pay    = document.getElementById('payCustomerId');
        const hist   = document.getElementById('hCustomer');
        const ledger = document.getElementById('ledgerCustomer');
        const keep   = [pay.value, hist.value, ledger.value];

        pay.innerHTML = '<option value="">-- কাস্টমার নির্বাচন করুন --</option>' +
            all.map(c => `<option value="${c.id}" data-due="${c.total_due}">${esc(c.name)}` +
                (c.total_due > 0 ? ' — বাকি: ' + money(c.total_due) : '') + '</option>').join('');

        const plain = all.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
        hist.innerHTML   = '<option value="">সকল কাস্টমার</option>' + plain;
        ledger.innerHTML = '<option value="">-- কাস্টমার নির্বাচন করুন --</option>' + plain;

        pay.value = keep[0]; hist.value = keep[1]; ledger.value = keep[2];
    }

    function renderDueList(all) {
        const list  = all.filter(c => c.total_due > 0);
        const tbody = document.getElementById('dueListBody');
        const tfoot = document.getElementById('dueListFoot');

        if (!list.length) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-success">
                <i class="bi bi-check-circle fs-3 d-block mb-2"></i>
                সকল গ্রাহকের বাকি পরিশোধ হয়েছে!</td></tr>`;
            tfoot.innerHTML = '';
            return;
        }

        tbody.innerHTML = list.map((c, i) => `
            <tr>
                <td class="text-muted">${i + 1}</td>
                <td class="fw-semibold">${esc(c.name)}</td>
                <td>${esc(c.phone || '—')}</td>
                <td class="text-end">${money(c.total_purchase)}</td>
                <td class="text-end">${money(c.total_purchase - c.total_due)}</td>
                <td class="text-end">
                    <span class="badge bg-danger fs-6">${money(c.total_due)}</span>
                </td>
                <td class="text-center">
                    <button class="btn btn-sm btn-success me-1"
                            onclick="goToPayment(${c.id})" title="পেমেন্ট নিন">
                        <i class="bi bi-cash-coin me-1"></i>পেমেন্ট নিন
                    </button>
                    <button class="btn btn-sm btn-outline-secondary"
                            onclick="goToLedger(${c.id})" title="খাতা দেখুন">
                        <i class="bi bi-journal-text"></i>
                    </button>
                </td>
            </tr>`).join('');

        tfoot.innerHTML = `
            <tr class="table-dark fw-bold">
                <td colspan="5">মোট বাকি (${list.length} জন)</td>
                <td class="text-end text-warning">${money(list.reduce((a, c) => a + c.total_due, 0))}</td>
                <td></td>
            </tr>`;
    }

    function refresh() {
        const all = customersWithDues();
        renderCards(all);
        renderSelects(all);
        renderDueList(all);
    }

    return { refresh };
})();

DueViews.refresh();

document.querySelectorAll('[data-bs-toggle="pill"]').forEach(btn => {
    btn.addEventListener('shown.bs.tab', () => DueViews.refresh());
});

(() => {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    document.getElementById('payDate').value =
        d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
})();
</script>

<script src="assets/js/app.js"></script>
<!-- unchanged copy of the original assets/js/payments.js -->
<script src="assets/js/payments.js"></script>
</body>
</html>
